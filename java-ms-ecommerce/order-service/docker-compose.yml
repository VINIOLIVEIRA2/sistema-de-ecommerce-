version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: order-service-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user"]
      interval: 5s
      timeout: 5s
      retries: 5
